[workspace]
members = [
    "crates/spirula-core",
    "crates/spirula-io",
    "crates/spirula-gpu",
    "crates/spirula-render",
    "crates/spirula-train",
    "crates/spirula-application",
    "crates/spirula-ui",
    "crates/spirula-cli",
    "tools/xtask",
]
resolver = "3"

[workspace.dependencies]
sha2 = "0.10.9"
serde_json = "1.0.154"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "tga", "tiff", "exr"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Spirula Studio contributors"]

# Inherited by every member via `[lints] workspace = true`. Keep this set
# narrow: deny new unsafe by default; allow only at the call site with a
# justification (today: spirula-io Windows MoveFileExW and OsStr prefix strip).
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unimplemented = "warn"
